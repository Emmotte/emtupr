name: TUI Release

on:
  push:
    tags:
      - "tui-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          BIN="emtupr"
          mkdir -p dist

          build_tar() {
            local os="$1"
            local arch="$2"
            local dir="dist/${BIN}_${VERSION}_${os}_${arch}"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "${dir}/${BIN}" .
            tar -C "$dir" -czf "dist/${BIN}_${VERSION}_${os}_${arch}.tar.gz" "${BIN}"
            rm -rf "$dir"
          }

          build_zip() {
            local os="$1"
            local arch="$2"
            local dir="dist/${BIN}_${VERSION}_${os}_${arch}"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "${dir}/${BIN}.exe" .
            (cd "$dir" && zip -q "../${BIN}_${VERSION}_${os}_${arch}.zip" "${BIN}.exe")
            rm -rf "$dir"
          }

          build_tar linux amd64
          build_tar linux arm64
          build_tar darwin amd64
          build_tar darwin arm64
          build_zip windows amd64

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
